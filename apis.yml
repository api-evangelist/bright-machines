aid: bright-machines
name: Bright Machines
description: 'Bright Machines is a San Francisco-based software-defined manufacturing
  company founded in 2018 by Amar Hanspal and Lior Susan that builds a full-stack intelligent
  automation platform for electronics and AI-infrastructure assembly. Its Microfactory
  pairs modular Bright Robotic Cells with Brightware, a platform operating system that
  orchestrates hardware, runs a machine-vision "Smart Skills" perception stack, and
  provides manufacturing-execution services for work orders, material management and
  real-time production KPIs. Bright Data, the company''s data layer, unifies component,
  process and enterprise-system data through secure APIs and auditable data flows, and
  Bright Designer turns product CAD into assembly-ready digital twins using NVIDIA Omniverse
  on Microsoft Azure. The company has raised roughly $279M from Eclipse, BlackRock, NVIDIA,
  Microsoft, Jabil and others. All platform and data interfaces are delivered to customers
  under commercial engagement; Bright Machines publishes no public developer portal, API
  documentation, SDKs or machine-readable API contracts.'
